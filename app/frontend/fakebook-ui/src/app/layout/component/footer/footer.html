<footer class="footer">
  <div class="footer__top">
    <div class="footer__brand">
      <div class="footer__brand-row">
        <div class="footer__logo">
          <div class="footer__diamond"></div>
        </div>

        <div class="footer__title">
          <span class="footer__title-dark">Fakebook</span
          ><span class="footer__title-green">Social</span>
        </div>
      </div>

      <p class="footer__description">
        A calmer place to share, chat, and stay close to the people you care about.
      </p>
    </div>

    <div class="footer__links">
      <div class="footer__column">
        <h4 class="footer__heading">Product</h4>
        <a *ngFor="let menu of productItems" href="#" class="footer__link">{{ menu.label }}</a>
      </div>

      <div class="footer__column">
        <h4 class="footer__heading">Company</h4>
        <a *ngFor="let menu of companyItems" href="#" class="footer__link">{{ menu.label }}</a>
      </div>
    </div>
  </div>

  <div class="footer__bottom">
    <span>© 2026 Fakebook Social, Son Huynh.</span>
    <span
      >This is the self learning product to help you learn and grow the software developer
      skills.</span
    >
  </div>
</footer>
