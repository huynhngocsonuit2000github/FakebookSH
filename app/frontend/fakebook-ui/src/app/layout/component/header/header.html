<header class="header">
  <div class="brand">
    <div class="brand-icon"><mat-icon>diamond</mat-icon></div>
    <div class="brand-name">Fake<span>book</span></div>
  </div>

  <div class="search">
    <input type="text" placeholder="Search Fakebook" />
  </div>

  <div class="actions">
    <a routerLink="/feed" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      ><mat-icon>home</mat-icon></a
    >
    <a routerLink="/explore" routerLinkActive="active"><mat-icon>explore</mat-icon></a>
    <a routerLink="/messages" routerLinkActive="active"><mat-icon>chat</mat-icon></a>
    <a routerLink="/notifications" routerLinkActive="active"><mat-icon>notifications</mat-icon></a>

    <div class="user-menu">
      <button class="avatar-button" type="button" (click)="toggleUserMenu()">
        <img src="/assets/design/1.avatar.webp" alt="User avatar" />
      </button>

      <app-user-menu *ngIf="userMenuOpen"></app-user-menu>
    </div>
  </div>
</header>
