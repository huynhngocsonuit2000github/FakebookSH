<div class="feed-page">
  <div class="feed-center">
    <app-story-list></app-story-list>

    <app-post-create (postCreated)="createPost($event)"></app-post-create>

    <p *ngIf="loading" class="feed-end-message">Loading feed...</p>
    <p *ngIf="error" class="feed-end-message">{{ error }}</p>

    <ng-container *ngFor="let post of posts$ | async">
      <app-post
        [post]="post"
        (reactionToggled)="toggleReaction($event)"
        (commentAdded)="addComment($event)"
        (savedToggled)="toggleSavedPost($event)"
      ></app-post>
    </ng-container>

    <p class="feed-end-message">You're all caught up</p>
  </div>

  <aside class="feed-right-sidebar">
    <app-right-sidebar></app-right-sidebar>
  </aside>
</div>
