<div class="post-list-page">
  <header>
    <h1>Saved posts</h1>
  </header>

  <p *ngIf="loading" class="page-message">Loading saved posts...</p>
  <p *ngIf="error" class="page-message">{{ error }}</p>
  <p *ngIf="!loading && !error && (posts$ | async)?.length === 0" class="page-message">No saved posts yet.</p>

  <ng-container *ngFor="let post of posts$ | async">
    <app-post
      [post]="post"
      (reactionToggled)="toggleReaction($event)"
      (commentAdded)="addComment($event)"
      (savedToggled)="toggleSavedPost($event)"
    ></app-post>
  </ng-container>
</div>
